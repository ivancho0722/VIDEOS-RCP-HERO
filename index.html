<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RCP HERO · Visor</title>
<style>
:root{--bg:#071016;--panel:#0d1820;--line:#1c3542;--text:#eef7fa;--muted:#8ea7b3;--cyan:#39e6ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 10%,rgba(57,230,255,.1),transparent 30%),linear-gradient(135deg,#050b10,#071016 55%,#08131b);color:var(--text);font-family:Segoe UI,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}.app{width:min(1100px,100%)}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:800;letter-spacing:.12em}.brand span{color:var(--cyan)}.badge{border:1px solid var(--line);border-radius:999px;padding:7px 12px;color:var(--muted);font-size:12px}.card{background:rgba(13,24,32,.95);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 18px 60px #0008}.top{padding:20px 22px 16px;border-bottom:1px solid var(--line)}h1{font-size:25px;margin:0 0 6px}#subtitle{margin:0;color:var(--muted)}.video{background:#000;aspect-ratio:16/9}.video video{width:100%;height:100%;display:block}.bottom{padding:18px 22px 22px;display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.file{font:14px Consolas,monospace;color:var(--cyan)}.hint{font-size:13px;color:var(--muted);margin-top:5px}.actions{display:flex;gap:10px}button,a{border:1px solid var(--line);background:#0b2029;color:var(--text);border-radius:10px;padding:10px 14px;text-decoration:none;font-weight:700;cursor:pointer}button:hover,a:hover{border-color:var(--cyan);color:var(--cyan)}.error{display:none;margin:18px 22px;padding:14px;border:1px solid #633b3b;border-radius:10px;background:#211214;color:#ffd7d7}.footer{text-align:center;color:#607984;font-size:11px;margin-top:14px}
</style>
</head>
<body>
<main class="app">
<div class="header"><div class="brand">RCP <span>HERO</span> · SIMULATION LAB</div><div class="badge">RECURSO AUDIOVISUAL</div></div>
<section class="card">
<div class="top"><h1 id="title">Recurso audiovisual</h1><p id="subtitle">Observa el ritmo y vuelve a la simulación para tomar tu decisión.</p></div>
<div class="video"><video id="player" controls playsinline preload="metadata"></video></div>
<div id="error" class="error"></div>
<div class="bottom"><div><div class="file" id="filename"></div><div class="hint">Analiza lo observado; no interpretes el ritmo por el nombre del archivo.</div></div><div class="actions"><button id="reload">↻ Recargar</button><a id="raw" target="_blank" rel="noopener">Abrir recurso</a></div></div>
</section><div class="footer">RCP HERO · Recurso de simulación educativa</div>
</main>
<script>
const REPO='https://raw.githubusercontent.com/ivancho0722/VIDEOS-RCP-HERO/main/';
const aliases={
 'taquicardia_ventricular_polimorfica.mp4':'TVPM.mp4',
 'bloqueo_2_grado_MOB2.mp4':'MOB2A.mp4'
};
const p=new URLSearchParams(location.search);
const requested=(p.get('video')||'AESP.mp4').split('/').pop().split('\\').pop();
const physical=aliases[requested]||requested;
const src=REPO+encodeURIComponent(physical);
const player=document.getElementById('player');
document.getElementById('filename').textContent=requested;
document.getElementById('title').textContent=requested.replace(/\.mp4$/i,'').replace(/_/g,' ').toUpperCase();
if(requested!==physical)document.getElementById('subtitle').textContent='Recurso audiovisual · archivo físico: '+physical;
player.src=src; document.getElementById('raw').href=src;
player.addEventListener('error',()=>{const e=document.getElementById('error');e.style.display='block';e.textContent='No se pudo cargar el recurso. Verifica el nombre exacto del archivo en VIDEOS-RCP-HERO: '+physical});
document.getElementById('reload').onclick=()=>{player.load();};
</script>
</body>
</html>
